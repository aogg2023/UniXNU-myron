name: unixnu-songyuan-kernel-macos

on:
  workflow_dispatch:

env:
  UNIXNU_IPSW: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw

jobs:
  kernel:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { repository: UniXNU/UniXNU, path: framework }
      - uses: actions/checkout@v4
        with: { repository: aogg2023/songyuan-device, path: songyuan-device }
      - uses: actions/checkout@v4
        with: { repository: aogg2023/songyuan-uefi, path: uefi }
      - name: xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          xcrun --find compression_tool
          df -h /
      - name: resolve fetch ipsw
        working-directory: framework
        run: |
          set -euo pipefail
          chmod +x unixnu
          ./unixnu defconfig songyuan_defconfig -D ../songyuan-device
          ./unixnu status
          ./unixnu fetch
          ./unixnu ipsw fetch KernelCache DeviceTree StaticTrustCache
      - name: build kernel
        working-directory: framework
        run: |
          set -uo pipefail
          ./unixnu build kernel; rc=$?
          echo "kernel build rc=$rc"
          for f in out/songyuan/logs/*.log; do echo "=== $f (tail) ==="; tail -80 "$f" || true; done
          exit $rc
      - name: show logs on failure
        if: failure()
        working-directory: framework
        run: |
          for f in out/songyuan/logs/*.log; do echo "=== $f ==="; tail -120 "$f" || true; done
      - name: collect logs
        if: always()
        run: |
          mkdir -p artifacts
          find framework/out -name '*.log' -print0 2>/dev/null | tar --null -czf artifacts/kernel-logs.tgz -T - || true
          find framework/out -name 'kernel.macho' -exec ls -l {} \; 2>/dev/null || true
          du -sh artifacts/* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unixnu-songyuan-kernel, path: artifacts/, retention-days: 3, if-no-files-found: warn }