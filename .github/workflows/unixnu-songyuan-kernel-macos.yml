name: unixnu-songyuan-kernel-macos

on:
  workflow_dispatch:

env:
  UNIXNU_IPSW: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { repository: UniXNU/UniXNU, path: framework }
      - uses: actions/checkout@v4
        with: { repository: aogg2023/songyuan-device, ref: master, path: songyuan-device }
      - uses: actions/checkout@v4
        with: { repository: aogg2023/songyuan-uefi, path: uefi }
      - name: xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          xcrun --find compression_tool
          brew install openssl@3
          df -h /
      - name: resolve fetch ipsw
        working-directory: framework
        run: |
          set -euo pipefail
          chmod +x unixnu
          ./unixnu defconfig songyuan_defconfig -D ../songyuan-device
          ./unixnu status
          ./unixnu fetch
          ./unixnu ipsw fetch KernelCache DeviceTree StaticTrustCache
      - name: verified root cache
        id: vrcache
        uses: actions/cache@v4
        with:
          path: |
            framework/out/songyuan/tree/build/verified-root-os
            framework/out/songyuan/tree/build/verified-root-systemos
            framework/out/songyuan/tree/build/verified-root-host
          key: verified-root-21H461-v1
          restore-keys: verified-root-21H461-
      - name: verified root inputs
        working-directory: framework
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/openssl@3/bin:$PATH"
          tree=$(ls -d out/songyuan/tree)
          volumes="$tree/.cache/firmware/target-volumes"
          host="$tree/build/verified-root-host"
          mkdir -p "$volumes" "$host/keys"
          if [ -f "$tree/build/verified-root-os/verification.json" ] &&
             [ -f "$tree/build/verified-root-systemos/verification.json" ] &&
             [ -f "$host/verified-root.dylib" ] && [ -f "$host/keys/owner.pem" ]; then
            echo "verified root fixtures restored from cache: $(ls -d "$tree"/build/verified-root-*)"
          else
            openssl version
            openssl genrsa -out "$host/keys/owner.pem" 3072
            openssl rsa -in "$host/keys/owner.pem" -pubout -out "$host/keys/owner-public.pem"
            clang -dynamiclib -O2 -Wall -Wextra \
              -I "$tree/kits/VerifiedRoot/include" -I /opt/homebrew/opt/openssl@3/include \
              "$tree/kits/VerifiedRoot/src/verified_root.c" \
              "$tree/kits/VerifiedRoot/tests/openssl_provider.c" \
              -L /opt/homebrew/opt/openssl@3/lib -lcrypto \
              -o "$host/verified-root.dylib"
            nm -gU "$host/verified-root.dylib" | grep -E 'vr_host_open|vr_host_block'
            ipsw="$RUNNER_TEMP/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
            [ -f "$ipsw" ] || curl -fL --retry 3 --retry-delay 5 -o "$ipsw" "$UNIXNU_IPSW"
            unzip -o -j "$ipsw" "044-76040-038.dmg" -d "$volumes"
            sysos_bytes=$((806400 * 4096))
            member=$(unzip -l "$ipsw" | awk -v want="$sysos_bytes" '$1 == want {print $4; exit}')
            if [ -z "$member" ]; then
              echo "no $sysos_bytes-byte member in the IPSW; its disk images are:"
              unzip -l "$ipsw" | grep -i '\.dmg' | head -20
              exit 1
            fi
            echo "SystemOS member: $member ($sysos_bytes bytes)"
            rm -rf "$RUNNER_TEMP/sysos" && mkdir -p "$RUNNER_TEMP/sysos"
            unzip -o -j "$ipsw" "$member" -d "$RUNNER_TEMP/sysos"
            mv -f "$RUNNER_TEMP/sysos/$(basename "$member")" "$volumes/044-76034-038.dmg"
            echo '3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d  '"$volumes/044-76040-038.dmg" | shasum -a 256 -c -
            echo 'b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f  '"$volumes/044-76034-038.dmg" | shasum -a 256 -c -
            mkdir -p "$volumes/os-mount"
            hdiutil attach -readonly -nobrowse -mountpoint "$volumes/os-mount" "$volumes/044-76040-038.dmg"
            python3 "$tree/scripts/build-owner-os-policy.py"
            python3 "$tree/scripts/build-owner-systemos-policy.py"
            hdiutil detach "$volumes/os-mount"
            rm -f "$volumes/044-76040-038.dmg" "$volumes/044-76034-038.dmg" "$ipsw"
          fi
          ls -l "$tree/build/verified-root-os" "$tree/build/verified-root-systemos" | head -20
      - name: reference kernel
        working-directory: framework
        run: |
          set -euo pipefail
          ./unixnu defconfig songyuan_reference_defconfig -D ../songyuan-device
          ./unixnu build kernel
          test -f out/songyuan/kernel/kernel.macho
          test -f out/songyuan/kernel/kernel.json
          rm -rf out/songyuan/tree/build/xnu/ios-obj
      - name: build kernel
        working-directory: framework
        run: |
          set -euo pipefail
          ./unixnu defconfig songyuan_defconfig -D ../songyuan-device
          mkdir -p out/songyuan/tree/build/xnu/ios-obj/EXPORT_HDRS/libsa
          set +e
          ./unixnu build kernel; rc=$?
          echo "kernel build rc=$rc"
          for f in out/songyuan/logs/*.log; do echo "=== $f (tail) ==="; tail -80 "$f" || true; done
          exit $rc
      - name: show logs on failure
        if: failure()
        working-directory: framework
        run: |
          for f in out/songyuan/logs/*.log; do echo "=== $f ==="; tail -120 "$f" || true; done
      - name: collect logs
        if: always()
        run: |
          mkdir -p artifacts
          find framework/out -name '*.log' -print0 2>/dev/null | tar --null -czf artifacts/kernel-logs.tgz -T - || true
          find framework/out -name 'kernel.macho' -exec ls -l {} \; 2>/dev/null || true
          du -sh artifacts/* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unixnu-songyuan-kernel, path: artifacts/, retention-days: 3, if-no-files-found: warn }
