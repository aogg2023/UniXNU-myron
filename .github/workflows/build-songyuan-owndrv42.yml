name: songyuan-owndrv42
# Same songyuan3 recipe that already reaches DXE, but every vendor DXE binary is replaced by the
# one extracted from THIS phone's uefi_a partition (GUID matched against the .inf skeleton), the
# way Reixo0/mu-silicium-nx809j boots its SM8850 board. FD stays at 0xC6900000 (board map), v0 image,
# strict payload shim and the checkpoint stripes/progress bar are kept.
on:
  workflow_dispatch:

env:
  FD_BASE: '0xC6900000'
  FD_SIZE: '0x300000'
  PAYLOAD_BASE: '0xF0000000'
  PAYLOAD_CAP: '0x3700000'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential uuid-dev nasm acpica-tools python3 python3-venv python3-pip clang lld llvm gcc-aarch64-linux-gnu libfuse3-dev xz-utils
          command -v lld-link || sudo ln -sf /usr/bin/lld.lld /usr/local/bin/lld-link

      - name: clone the hackios helpers and Mu-Silicium
        run: |
          git clone --depth 1 -b k90-port https://github.com/aogg2023/hackios-xnu-kernel.git hk
          git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git
          cd Mu-Silicium
          git fetch --depth 1 origin 4cba43c90e02cdbefbcd9fcdbda33d2328deaec0
          git checkout -q 4cba43c90e02cdbefbcd9fcdbda33d2328deaec0
          git submodule update --init --recursive --depth 1

      - name: vendor .inf skeleton (infiniti; binaries are replaced below)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Project-Silicium/Device-Binaries.git devbin
          cd devbin && git sparse-checkout set infiniti && cd ..
          cp -r devbin/infiniti Mu-Silicium/Binaries/songyuan
          find Mu-Silicium/Binaries/songyuan -name '*.inf' | wc -l

      - name: our own drivers from the phone's uefi_a (private repo)
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.SONGYUAN_FW_TOKEN }}@github.com/aogg2023/songyuan-fw.git fw
          mkdir -p fw/fv
          tar -xJf fw/songyuan-fv.tar.xz -C fw/fv
          ls fw/fv | wc -l

      - name: replace the vendor binaries by GUID
        run: |
          python3 - <<'EOF'
          import os, re, shutil
          skeleton = 'Mu-Silicium/Binaries/songyuan'
          fv = 'fw/fv'
          by_guid = {}
          for name in os.listdir(fv):
              d = os.path.join(fv, name)
              if not os.path.isdir(d):
                  continue
              for f in os.listdir(d):
                  if f.endswith('.guid'):
                      g = open(os.path.join(d, f), encoding='utf-8', errors='replace').read().split()[0].upper()
                      by_guid.setdefault(g, d)
          matched = missing = 0
          missing_names = []
          for root, dirs, files in os.walk(skeleton):
              for fn in files:
                  if not fn.endswith('.inf'):
                      continue
                  p = os.path.join(root, fn)
                  txt = open(p, encoding='utf-8', errors='replace').read()
                  m = re.search(r'FILE_GUID\s*=\s*([0-9A-Fa-f-]{36})', txt)
                  if not m:
                      continue
                  guid = m.group(1).upper()
                  names = re.findall(r'PE32\|\s*([^|\r\n]+)', txt)
                  src = by_guid.get(guid)
                  if not src:
                      missing += 1
                      missing_names.append(fn)
                      continue
                  efis = [x for x in os.listdir(src) if x.endswith('.efi')]
                  if not efis:
                      missing += 1
                      missing_names.append(fn)
                      continue
                  target = names[0].strip() if names else fn[:-4] + '.efi'
                  shutil.copy(os.path.join(src, efis[0]), os.path.join(root, target))
                  matched += 1
          print('replaced', matched, 'drivers; missing', missing)
          if missing_names:
              print('missing:', ' '.join(missing_names[:20]))
          if matched < 40:
              raise SystemExit('too few drivers replaced')
          EOF

      - name: overlay the songyuan3 port
        run: |
          cp -r hk/uefi/songyuan3/files/. Mu-Silicium/
          test -f Mu-Silicium/Resources/Configs/songyuan.toml
          grep -q '^base = 0xC6900000' Mu-Silicium/Resources/Configs/songyuan.toml
      - name: device inputs from our own uefi_a (FdtBlob + RAW files)
        run: |
          curl -sSL -o myron.dtb https://raw.githubusercontent.com/Typeun/myron-uefi/main/Resources/DTBs/myron.dtb
          echo "42a2257670e909f82540c3a156444f17f50644702363a6b0f747b1d48e3aa61b  myron.dtb" | sha256sum -c -
          cp myron.dtb Mu-Silicium/Platforms/OnePlus/songyuanPkg/FdtBlob/kaanapali-oneplus-songyuan.dtb
          python3 - <<'EOF'
          import os, shutil
          fv = 'fw/fv'
          dst = 'Mu-Silicium/Binaries/songyuan/RawFiles'
          os.makedirs(dst, exist_ok=True)
          out = ['# generated from this phone uefi_a FFS entries (GUID matched)']
          n = 0
          for name in sorted(os.listdir(fv)):
              d = os.path.join(fv, name)
              if not os.path.isdir(d):
                  continue
              files = os.listdir(d)
              if any(f.lower().endswith('.efi') for f in files):
                  continue
              payload = [f for f in files if not f.lower().endswith(('.depex', '.guid')) and '.' in f]
              guids = [f for f in files if f.lower().endswith('.guid')]
              if not payload or not guids:
                  continue
              g = open(os.path.join(d, guids[0]), encoding='utf-8', errors='replace').read().split()[0].upper()
              f = payload[0]
              shutil.copy(os.path.join(d, f), os.path.join(dst, f))
              out += ['FILE FREEFORM = %s {' % g,
                      '  SECTION UI = "%s"' % f,
                      '  SECTION RAW = Binaries/songyuan/RawFiles/%s' % f,
                      '}']
              n += 1
          open('Mu-Silicium/Platforms/OnePlus/songyuanPkg/Include/RAW.inc', 'w', encoding='utf-8').write('\n'.join(out) + '\n')
          print('RAW entries generated', n)
          EOF
          grep -c 'FILE FREEFORM' Mu-Silicium/Platforms/OnePlus/songyuanPkg/Include/RAW.inc


      - name: fix the frame buffer geometry in the package (our panel is 1200x2608)
        # The songyuan package was renamed from OnePlus 15 (1272x2772) / Ace 5 (1264x2780) files and
        # kept their PcdFrameBufferWidth/Height; the GOP and the DEBUG console then render with the
        # wrong stride, which is why the debug text was unreadable. BOOT-CONTRACT B9: 1200x2608, stride 4800.
        run: |
          dsc=Mu-Silicium/Platforms/OnePlus/songyuanPkg/songyuan.dsc
          sed -i 's/^\(  gSiliciumPkgTokenSpaceGuid.PcdFrameBufferWidth|\).*/\11200/' "$dsc"
          sed -i 's/^\(  gSiliciumPkgTokenSpaceGuid.PcdFrameBufferHeight|\).*/\12608/' "$dsc"
          grep -n 'PcdFrameBuffer' "$dsc"
      - name: hook the XNU loader into BootManager
        run: |
          python3 hk/uefi/songyuan/patch_bootmanager_xnuloader.py \
            Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/BootManager.c \
            Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/BootManagerLib.inf
          grep -c XnuLoaderMain Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/BootManager.c
      - name: hand over to the XNU loader right after the console stage
        run: |
          python3 - <<'EOF'
          p = 'Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/BootManager.c'
          s = open(p, encoding='utf-8').read()
          old = '  // Execute Secondary After Console\n  DeviceBootManagerAfterConsole ();\n}'
          new = ('  // Execute Secondary After Console\n  DeviceBootManagerAfterConsole ();\n\n'
                 '  // No storage or input on this RAM boot: hand over to the XNU loader now\n'
                 '  XnuLoaderMain ();\n}')
          assert old in s, 'AfterConsole tail not found'
          s = s.replace(old, new, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('AfterConsole hook inserted')
          EOF
          grep -n -A4 'DeviceBootManagerAfterConsole' Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/BootManager.c | tail -8


      - name: drop the drivers that hang or do not exist on this board
        run: |
          python3 - <<'EOF'
          drop = ('SPMIDxe','PmicDxe','ChargerExDxe','QcomChargerDxe','PmicGlinkSoccpDxe','OGaugeAuth','ButtonsDxe','OcdtDxe','UFSDxe','OplusVibrDxe','OplusS4ResetDxe','TLMMExDxe','PhoenixDxe','OplusStorageDxe','OplusProject','OplusOrdump','Phoenix2_0Dxe','OplusSecurityDxe','FontDxe','XhciPciEmulationDxe','XhciDxe','UsbBusDxe','UsbKbDxe','UsbMassStorageDxe','UsbMsdDxe')
          path = 'Mu-Silicium/Platforms/OnePlus/songyuanPkg/Include/DXE.inc'
          lines = open(path, encoding='utf-8').read().split('\n')
          out = []
          for line in lines:
              if line.strip().startswith('INF ') and any(d in line for d in drop):
                  out.append('# ' + line)
              else:
                  out.append(line)
          open(path, 'w', encoding='utf-8').write('\n'.join(out))
          kept = [l for l in out if l.strip().startswith('INF ')]
          print('DXE.inc kept', len(kept))
          EOF
      - name: inject the checkpoint stripes and the DXE progress bar
        run: |
          python3 - <<'EOF'
          STRIPE = (
              '  {\n'
              '    UINTN MyY, MyX; volatile UINT32 *MyFb = (volatile UINT32 *)(UINTN)0xFC800000ULL;\n'
              '    for (MyY = 0; MyY < 2600; MyY++) { for (MyX = 0; MyX < 80; MyX++) { MyFb[MyY * 1200 + %d + MyX] = %s; } }\n'
              '  }\n'
          )
          BAR = (
              '  {\n'
              '    static UINTN MyBar = 0; UINTN MyY, MyX, MyI; volatile UINT32 *MyFb = (volatile UINT32 *)(UINTN)0xFC800000ULL;\n'
              '    static const UINT32 MyCol[10] = {0xFFFFFF00u, 0xFF00FFFFu, 0xFFFF00FFu, 0xFFFF8000u, 0xFF00FF00u,\n'
              '                                      0xFF0000FFu, 0xFFFFFFFFu, 0xFFFF0000u, 0xFF808080u, 0xFF0080FFu};\n'
              '    if (MyBar < 96) {\n'
              '      UINT32 MyC = MyCol[(MyBar / 10) % 10];\n'
              '      for (MyY = 200; MyY < 236; MyY++) { for (MyX = 0; MyX < 10; MyX++) { MyFb[MyY * 1200 + MyBar * 12 + MyX] = MyC; } }\n'
              '      for (MyI = 0; MyI < 8; MyI++) {\n'
              '        UINT32 MyB = ((MyBar >> MyI) & 1u) ? 0xFFFFFFFFu : 0xFF000040u;\n'
              '        for (MyY = 300; MyY < 380; MyY++) { for (MyX = 0; MyX < 40; MyX++) { MyFb[MyY * 1200 + 100 + MyI * 60 + MyX] = MyB; } }\n'
              '      }\n'
              '      MyBar++;\n'
              '    }\n'
              '  }\n'
          )
          def patch(path, signature, text):
              s = open(path, encoding='utf-8').read()
              i = s.index(signature)
              j = s.index('\n{\n', i)
              open(path, 'w', encoding='utf-8').write(s[:j + 3] + text + s[j + 3:])
              print('patched', path)
          b = 'Mu-Silicium/Mu_Basecore/'
          patch(b + 'MdeModulePkg/Core/Pei/PeiMain/PeiMain.c', 'PeiCore (', STRIPE % (0, '0xFFFF0000u'))
          patch(b + 'MdeModulePkg/Core/Pei/Dispatcher/Dispatcher.c', 'PeiDispatcher (', STRIPE % (100, '0xFFFFFF00u'))
          patch(b + 'MdeModulePkg/Core/Dxe/DxeMain/DxeMain.c', 'DxeMain (', STRIPE % (200, '0xFF00FF00u'))
          patch(b + 'MdeModulePkg/Universal/BdsDxe/BdsEntry.c', 'BdsEntry (', STRIPE % (300, '0xFF0000FFu'))
          patch(b + 'MdeModulePkg/Core/Dxe/Image/Image.c', 'CoreStartImage (', BAR)
          EOF

      - name: add a magenta marker to the phone loader
        # loader.efi paints a magenta block at y=1200 first, proving XnuLoaderMain started the payload
        # (BDS passed and the unable-to-boot path ran).
        run: |
          python3 - <<'EOF'
          path = 'hk/xnuloader/loader_06_usb_entry.inc'
          s = open(path, encoding='utf-8').read()
          sig = 'efi_main(efi_handle image, efi_system_table *st)'
          i = s.index(sig)
          j = s.index('{', i) + 1
          mark = ('\n  { volatile unsigned int *MyP = (volatile unsigned int *)(0xFC800000UL + 1200UL * 1200UL * 4UL);'
                  ' unsigned int MyI; for (MyI = 0; MyI < 240000U; MyI++) MyP[MyI] = 0xFFFF00FFu; }\n')
          open(path, 'w', encoding='utf-8').write(s[:j] + mark + s[j:])
          print('loader marker inserted')
          EOF
      - name: patch the TzDxeLA QseeCom assert (line 246) out of the binary
        run: |
          python3 - <<'PYEOF'
          import glob, hashlib
          want = 'a075b6fb1699268818a9793fed628baa924d1c17cdfa9a66b0a249dc172e289f'
          for p in glob.glob('Mu-Silicium/Binaries/songyuan/**/*.efi', recursive=True):
              d = open(p, 'rb').read()
              if hashlib.sha256(d).hexdigest() != want:
                  continue
              assert d[0x3380:0x3384] == b'\x40\x00\x00\x90', d[0x3380:0x3384].hex()
              b = bytearray(d)
              b[0x3380:0x3384] = bytes.fromhex('dbffff17')   # b 0x32ec
              for off in range(0x3384, 0x3398, 4):
                  b[off:off+4] = bytes.fromhex('1f2003d5')   # nop
              open(p, 'wb').write(bytes(b))
              print('patched', p, hashlib.sha256(bytes(b)).hexdigest())
          PYEOF

      - name: use the complete K100 memory map (free DDR from the live DT)
        run: |
          cp assets/songyuan/MemoryMapLib_v37.c Mu-Silicium/Platforms/OnePlus/songyuanPkg/Library/MemoryMapLib/MemoryMapLib.c
          python3 - <<'PYEOF'
          import re
          p = 'Mu-Silicium/Platforms/OnePlus/songyuanPkg/Library/MemoryMapLib/MemoryMapLib.c'
          s = open(p, encoding='utf-8').read()
          rows = []
          for ln in s.split('\n'):
              m = re.match(r'\s*\{"([^"]+)"\s*,\s*(0x[0-9A-Fa-f]+)\s*,\s*(0x[0-9A-Fa-f]+)', ln)
              if m:
                  rows.append((m.group(1), int(m.group(2),16), int(m.group(3),16)))
          d = {n:(a,l) for n,a,l in rows}
          assert ('UEFI_FD' in d) and d['UEFI_FD'] == (0xC6900000, 0x300000), d.get('UEFI_FD')
          assert ('XNU_Payload' in d) and d['XNU_Payload'] == (0xF0000000, 0x3800000)
          assert ('CPU_Vectors' in d) and d['CPU_Vectors'] == (0xC6E00000, 0x1000)
          free = [(a,l) for n,a,l in rows if n == 'DDR_Free']
          total = sum(l for a,l in free)
          assert total >= 8*1024**3, ('free DDR too small', hex(total))
          ddr = sorted([(a,l,n) for n,a,l in rows if 0x80000000 <= a < 0x10000000000], key=lambda x:x[0])
          for x,y in zip(ddr, ddr[1:]):
              assert x[0]+x[1] <= y[0], ('overlap', x, y)
          print('memory map OK: %d entries, %d free DDR regions, %.1f GB free' % (len(rows), len(free), total/2**30))
          PYEOF

      - name: drop the SMBIOS drivers (their protocol calls crash on our mixed driver set)
        run: |
          f=Mu-Silicium/Platforms/OnePlus/songyuanPkg/songyuan.fdf
          sed -i -E 's|^([[:space:]]*)INF MdeModulePkg/Universal/SmbiosDxe/SmbiosDxe.inf|#\1INF MdeModulePkg/Universal/SmbiosDxe/SmbiosDxe.inf|' "$f"
          sed -i -E 's|^([[:space:]]*)INF SiliciumPkg/Drivers/SmBiosTableDxe/SmBiosTableDxe.inf|#\1INF SiliciumPkg/Drivers/SmBiosTableDxe/SmBiosTableDxe.inf|' "$f"
          grep -n -i smbios "$f" || true

      - name: firmware-side beacons in XnuLoader (stage colors on the panel)
        run: |
          python3 - <<'PYEOF'
          p = 'Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/XnuLoader.c'
          s = open(p, encoding='utf-8').read()
          helper = ('\nSTATIC\nVOID\nXnuBeacon (\n  UINTN  Y,\n  UINT32 Color\n  )\n{\n'
                    '  volatile UINT32 *F = (volatile UINT32 *)(UINTN)0xFC800000ULL;\n'
                    '  UINTN y, x;\n'
                    '  for (y = Y; y < Y + 60; y++) {\n'
                    '    for (x = 500; x < 1100; x++) {\n'
                    '      F[y * 1200 + x] = Color;\n'
                    '    }\n'
                    '  }\n}\n')
          assert '#include "XnuLoader.h"' in s
          s = s.replace('#include "XnuLoader.h"', '#include "XnuLoader.h"\n' + helper, 1)
          old = ('  if ((Header->Magic != XNU_PAYLOAD_MAGIC) || (Header->Size > XNU_PAYLOAD_MAX_SIZE - sizeof (XNU_PAYLOAD_HEADER))) {\n'
                 '    return;\n  }')
          new = ('  if ((Header->Magic != XNU_PAYLOAD_MAGIC) || (Header->Size > XNU_PAYLOAD_MAX_SIZE - sizeof (XNU_PAYLOAD_HEADER))) {\n'
                 '    XnuBeacon (650, 0xFFFF0000);\n'
                 '    return;\n  }\n'
                 '  XnuBeacon (650, 0xFF00FF00);')
          assert old in s, 'magic check anchor missing'
          s = s.replace(old, new, 1)
          old2 = ('      if (!EFI_ERROR (gBS->LoadImage (FALSE, gImageHandle, NULL, Entry + 1, Entry->Size, &Handle))) {\n'
                  '        gBS->StartImage (Handle, NULL, NULL);\n      }')
          new2 = ('      LoadStatus = gBS->LoadImage (FALSE, gImageHandle, NULL, Entry + 1, Entry->Size, &Handle);\n'
                  '      if (!EFI_ERROR (LoadStatus)) {\n'
                  '        XnuBeacon (800, 0xFF00FF00);\n'
                  '        gBS->StartImage (Handle, NULL, NULL);\n'
                  '        XnuBeacon (950, 0xFFFFFF00);\n'
                  '      } else {\n'
                  '        XnuBeacon (800, 0xFFFF0000);\n      }')
          assert old2 in s, 'LoadImage anchor missing'
          s = s.replace(old2, new2, 1)
          s = s.replace('      EFI_HANDLE Handle;', '      EFI_HANDLE Handle;\n      EFI_STATUS LoadStatus;', 1)
          old3 = 'StartPayloadLoader ()\n{'
          assert old3 in s
          s = s.replace(old3, 'StartPayloadLoader ()\n{\n  XnuBeacon (500, 0xFF00FFFF);', 1)
          old4 = 'XnuLoaderMain ()\n{'
          assert old4 in s
          s = s.replace(old4, 'XnuLoaderMain ()\n{\n  XnuBeacon (400, 0xFFFF00FF);', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('beacons inserted')
          PYEOF

      - name: loader makes the kernel write its console log to the pinned UFS file
        run: |
          python3 - <<'PYEOF'
          p = 'hk/xnuloader/loader_05_layout_run_kernel.inc'
          s = open(p, encoding='utf-8').read()
          old = '\tdt_prop_u32(&w, "embedded-panic-log-size", PANIC_LOG_SIZE);'
          new = (old + '\n'
                 '#ifdef PANDORA_LOG_EXT_PART\n'
                 '\tstatic const uint64_t pandora_log_ext[3] = { 0, PANDORA_LOG_EXT_PART, PANDORA_LOG_EXT_BLOCKS };\n'
                 '\tdt_prop(&w, "pandora-log-extents", pandora_log_ext, sizeof(pandora_log_ext));\n'
                 '\tdt_prop_u64(&w, "pandora-log-blocks", PANDORA_LOG_EXT_BLOCKS);\n'
                 '#endif')
          assert s.count(old) == 1, s.count(old)
          open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
          print('pandora log extents added to the loader DT')
          PYEOF

      - name: loader accepts an "adt" payload entry as the kernel device tree
        run: |
          python3 - <<'PYEOF'
          p = 'hk/xnuloader/loader_04_fault_payload_nvram.inc'
          s = open(p, encoding='utf-8').read()
          old = '\tconst uint8_t *kernel;'
          new = ('\tconst uint8_t *kernel;\n\tconst uint8_t *adt;\n\tuint64_t adt_size;')
          assert s.count(old) == 1, ('struct anchor', s.count(old))
          s = s.replace(old, new, 1)
          anchor = '\t\t} else if (str_eq(e->name, "cmdline")) {'
          add = ('\t\t} else if (str_eq(e->name, "adt")) {\n'
                 '\t\t\tpi->adt = p + sizeof(*e);\n'
                 '\t\t\tpi->adt_size = e->size;\n')
          assert s.count(anchor) == 1, ('parse anchor', s.count(anchor))
          s = s.replace(anchor, add + anchor, 1)
          open(p, 'w', encoding='utf-8').write(s)

          p = 'hk/xnuloader/loader_05_layout_run_kernel.inc'
          s = open(p, encoding='utf-8').read()
          old = '\tuint32_t dt_len = (uint32_t)(w.cur - w.base);'
          new = (old + '\n'
                 '\t/* An "adt" payload entry is the phone\'s real Apple device tree: use it verbatim. */\n'
                 '\tif (pi.adt != NULL && pi.adt_size != 0 && (uint64_t)pi.adt_size <= (uint64_t)(ba_pa - dt_pa)) {\n'
                 '\t\tmemcpy((void *)(uintptr_t)dt_pa, pi.adt, (size_t)pi.adt_size);\n'
                 '\t\tdt_len = (uint32_t)pi.adt_size;\n'
                 '\t}')
          assert s.count(old) == 1, ('dt_len anchor', s.count(old))
          s = s.replace(old, new, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('ADT passthrough patch applied')
          PYEOF

      - name: build the loader and the payload
        env:
          EXTRA_CFLAGS: '-DPANDORA_LOG_EXT_PART=0xBCC00 -DPANDORA_LOG_EXT_BLOCKS=0x1000 -DDIRECT_PHONE_PLAT -DPHONE_PLATFORM=platform_songyuan -DPHONE_FB_WIDTH=1200 -DPHONE_FB_HEIGHT=2608'
        run: |
          cd hk/xnuloader
          export BUILD_ID=$(git -C .. rev-parse HEAD)
          bash build.sh
          cd ../..
          python3 hk/xnuloader/mkpayload.py -o payload.bin loader.efi=hk/xnuloader/loader-phone.efi --usb
          python3 - <<'PYEOF'
          import struct
          b = open("payload.bin","rb").read()
          assert b[:4] == b"XNUP", "payload magic"
          cur, end = 8, 8 + struct.unpack_from("<I", b, 4)[0]
          names = []
          while cur + 24 <= end:
              name = b[cur:cur+16].split(b"\0")[0].decode()
              if not name: break
              size = struct.unpack_from("<I", b, cur+16)[0]
              names.append((name, size))
              cur = cur + 24 + ((size + 15) & ~15)
          print("payload entries:", names)
          assert any(n == "loader.efi" for n, _ in names), "loader entry missing"
          assert any(n == "usb" for n, _ in names), "usb flag missing"
          PYEOF

      - name: build our EFI loader (data-a-live boot contract) and its XNUP payload
        run: |
          clang --target=aarch64-unknown-windows-msvc -ffreestanding -nostdlib -Os \
            -c assets/songyuan/loader_efi.c -o loader_efi.o
          lld-link /subsystem:efi_application /entry:efi_main /base:0xA1000000 \
            /nodefaultlib /out:loader_efi.efi loader_efi.o
          ls -l loader_efi.efi
          python3 hk/xnuloader/mkpayload.py -o payload.bin \
            loader.efi=loader_efi.efi \
            kernel=assets/songyuan/kernel-d22ap.macho \
            adt=assets/songyuan/phone.adt \
            --cmdline "debug=0x8 rd=md0 debug=0xc serial=3 cpus=1 keepsyms=1 -v -noprogress"
          python3 - <<'PYEOF'
          import struct
          b = open('payload.bin','rb').read()
          assert b[:4] == b'XNUP', 'payload magic'
          cur, end = 8, 8 + struct.unpack_from('<I', b, 4)[0]
          names = []
          while cur + 24 <= end:
              name = b[cur:cur+16].split(b'\0')[0].decode()
              if not name: break
              size = struct.unpack_from('<I', b, cur+16)[0]
              names.append((name, size))
              cur = cur + 24 + ((size + 15) & ~15)
          print('payload entries:', names)
          assert any(n == 'loader.efi' for n,_ in names)
          assert any(n == 'kernel' and s > 0x1000000 for n,s in names)
          assert any(n == 'adt' for n,_ in names)
          PYEOF

      - name: nasm shim and venv
        run: |
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p $D/Linux-x86-64
          echo 'version: 20016.1.1' > $D/extdep_state.yaml
          ln -sf /usr/bin/nasm /usr/bin/ndisasm $D/Linux-x86-64/ 2>/dev/null || true
          python3 -m venv venv
          venv/bin/pip install -r Mu-Silicium/pip-requirements.txt

      - name: build uefi
        run: |
          cd Mu-Silicium
          source ../venv/bin/activate
          python3 build_uefi.py -d songyuan -r DEBUG
          ls -l Build/songyuanPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd

      - name: rebuild the strict shim after build_uefi.py
        run: |
          cd Mu-Silicium/BootShim
          rm -f BootShim.bin BootShim.elf
          make -B REQUIRES_KERNEL_HEADER=1 FD_BASE=$FD_BASE FD_SIZE=$FD_SIZE \
            CFLAGS="--target=aarch64-linux-gnu -DPAYLOAD_BASE=$PAYLOAD_BASE -DPAYLOAD_CAP=$PAYLOAD_CAP"
          test "$(stat -c%s BootShim.bin)" -gt 300

      - name: pack the v0 boot image
        run: |
          python3 - <<'EOF'
          import gzip, hashlib, struct
          fd_size = 0x300000
          fd = open('Mu-Silicium/Build/songyuanPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd', 'rb').read()
          print('FD', len(fd), 'sha256', hashlib.sha256(fd).hexdigest())
          if len(fd) < fd_size:
              fd += b'\0' * (fd_size - len(fd))
          shim = open('Mu-Silicium/BootShim/BootShim.bin', 'rb').read()
          payload = open('payload.bin', 'rb').read()
          payload += b'\0' * (-len(payload) % 16)
          blob = shim + fd + payload
          dtb = open('Mu-Silicium/Resources/DTBs/songyuan.dtb', 'rb').read()
          kernelfield = gzip.compress(blob, 6) + dtb
          PAGE = 4096
          hdr = bytearray(1632)
          hdr[0:8] = b'ANDROID!'
          struct.pack_into('<I', hdr, 8, len(kernelfield))
          struct.pack_into('<I', hdr, 12, 0x8000)
          struct.pack_into('<I', hdr, 32, 0x1e00000)
          struct.pack_into('<I', hdr, 36, PAGE)
          pad = lambda b: b + b'\0' * (-len(b) % PAGE)
          img = pad(bytes(hdr)) + pad(kernelfield)
          open('out-songyuan-owndrv42.img', 'wb').write(img)
          print('shim', len(shim), 'payload', len(payload), 'image', len(img),
                'sha256', hashlib.sha256(img).hexdigest())
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: songyuan-owndrv42
          path: out-songyuan-owndrv42.img
          if-no-files-found: error





