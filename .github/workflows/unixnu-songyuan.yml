name: unixnu-songyuan

on:
  workflow_dispatch:

env:
  IPSW: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: framework
        uses: actions/checkout@v4
        with:
          path: framework
      - name: device repo
        uses: actions/checkout@v4
        with:
          repository: aogg2023/songyuan-device
          path: songyuan-device
      - name: uefi repo
        uses: actions/checkout@v4
        with:
          repository: aogg2023/songyuan-uefi
          path: uefi
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm lld nasm acpica-tools uuid-dev libssl-dev mtools dosfstools lz4 liblz4-dev device-tree-compiler python3-venv python3-pip zip
          sudo apt-get install -y --no-install-recommends lzfse || true
          df -h / | tail -1
      - name: resolve and fetch
        working-directory: framework
        run: |
          chmod +x unixnu
          ./unixnu defconfig songyuan_defconfig -D ../songyuan-device 2>&1 | tail -10
          ./unixnu fetch 2>&1 | tail -10
          ./unixnu --ipsw "$IPSW" ipsw fetch 2>&1 | tail -10
      - name: build kernel package firmware payload bootimg
        working-directory: framework
        run: |
          ./unixnu --ipsw "$IPSW" build kernel 2>&1 | tail -20
          ./unixnu --ipsw "$IPSW" build package 2>&1 | tail -20
          ./unixnu --ipsw "$IPSW" build firmware --uefi ../uefi 2>&1 | tail -20
          ./unixnu --ipsw "$IPSW" build payload 2>&1 | tail -20
          ./unixnu --ipsw "$IPSW" bootimg 2>&1 | tail -20
          echo "=== output tree (dirs) ==="
          find out -maxdepth 5 -type d | head -60
          echo "=== output files ==="
          find out -type f \( -name '*.img' -o -name '*.macho' -o -name '*.efi' -o -name '*.fd' -o -name 'boot.json' -o -name 'payload.json' -o -name 'userdata-root.json' \) -exec ls -l {} \; 2>/dev/null
      - name: collect outputs
        if: always()
        run: |
          mkdir -p artifacts
          cd framework
          find out -type f \( -name '*.img' -o -name '*.macho' -o -name '*.efi' -o -name '*.fd' -o -name '*.json' -o -name '*.log' \) -print0 | tar --null -czf ../artifacts/unixnu-out.tgz -T - 2>/dev/null || true
          cd ..
          ls -la artifacts
          du -sh artifacts/* 2>/dev/null
      - name: upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-songyuan-out
          path: artifacts/
          retention-days: 3
          if-no-files-found: warn